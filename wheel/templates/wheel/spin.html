{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spin the Wheel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h2 {
      margin-bottom: 20px;
    }

    .wheel-container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        #f44336 0% 16.66%,       /* 10 Coins */
        #e91e63 16.66% 33.33%,   /* Try Again */
        #9c27b0 33.33% 50%,      /* 50 Coins */
        #3f51b5 50% 66.66%,      /* 100 Coins */
        #03a9f4 66.66% 83.33%,   /* No Prize */
        #4caf50 83.33% 100%      /* Jackpot */
      );
      transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }

    .label {
      position: absolute;
      width: 50%;
      height: 50%;
      left: 50%;
      top: 50%;
      transform-origin: 0% 0%;
      font-weight: bold;
      font-size: 18px;
      color: white;
      text-shadow: 2px 2px 4px #000;
    }

    .label:nth-child(1) { transform: rotate(30deg) translateX(20%); }
    .label:nth-child(2) { transform: rotate(90deg) translateX(20%); }
    .label:nth-child(3) { transform: rotate(150deg) translateX(20%); }
    .label:nth-child(4) { transform: rotate(210deg) translateX(20%); }
    .label:nth-child(5) { transform: rotate(270deg) translateX(20%); }
    .label:nth-child(6) { transform: rotate(330deg) translateX(20%); }

    .pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 30px solid red;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    #spin-btn {
      width: 80px;
      height: 80px;
      background-color: gold;
      border: 4px solid #333;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 3;
    }

    #result {
      margin-top: 40px;
      font-size: 28px;
      font-weight: bold;
      color: #444;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h2>🎯 Spin & Win!</h2>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <div class="label">10 Coins</div>
      <div class="label">Try Again</div>
      <div class="label">50 Coins</div>
      <div class="label">100 Coins</div>
      <div class="label">No Prize</div>
      <div class="label">Jackpot</div>
    </div>
    <button id="spin-btn">SPIN</button>
  </div>

  <p id="result"></p>

  <script>
    const wheel = document.getElementById("wheel");
    const spinBtn = document.getElementById("spin-btn");
    const result = document.getElementById("result");

    let deg = 0;

    spinBtn.addEventListener("click", () => {
      const randomDeg = Math.floor(1024 + Math.random() * 1024);
      deg += randomDeg;
      wheel.style.transform = `rotate(${deg}deg)`;

      result.textContent = ""; // clear old result

      fetch("/spin/", {
        method: "POST",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "user=Guest"
      })
      .then(response => response.json())
      .then(data => {
        setTimeout(() => {
          result.innerText = "🎉 You won: " + data.prize;
        }, 4000); // show after spin
      });
    });

    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }
  </script>

</body>
</html>
