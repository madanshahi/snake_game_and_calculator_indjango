<!DOCTYPE html>
<html>
<head>
    <title>Advanced Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px #888;
            width: fit-content;
        }
        .calculator form {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            gap: 10px;
        }
        input[type="text"] {
            grid-column: span 4;
            padding: 15px;
            font-size: 20px;
            text-align: right;
        }
        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            background: #444;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button.operator {
            background: #ff9500;
        }
        button.equal {
            background: #34c759;
        }
    </style>
    <script>
        function addToExpression(value) {
            document.getElementById("expression").value += value;
        }

        function clearExpression() {
            document.getElementById("expression").value = '';
        }

        function calculate() {
            document.getElementById("calcForm").submit();
        }
    </script>
</head>
<body>

   <div class="container">
    <div class="col-md-12">
        <div class="row">
            <center>
                <h1>Simple calculator complete project</h1><br>
            
            <div class="calculator">
                <form method="post" id="calcForm">
                    {% csrf_token %}
                    <input type="text" id="expression" name="expression" value="{{ result }}" readonly>
                    <button type="button" onclick="addToExpression('7')">7</button>
                    <button type="button" onclick="addToExpression('8')">8</button>
                    <button type="button" onclick="addToExpression('9')">9</button>
                    <button type="button" class="operator" onclick="addToExpression('/')">/</button>
        
                    <button type="button" onclick="addToExpression('4')">4</button>
                    <button type="button" onclick="addToExpression('5')">5</button>
                    <button type="button" onclick="addToExpression('6')">6</button>
                    <button type="button" class="operator" onclick="addToExpression('*')">*</button>
        
                    <button type="button" onclick="addToExpression('1')">1</button>
                    <button type="button" onclick="addToExpression('2')">2</button>
                    <button type="button" onclick="addToExpression('3')">3</button>
                    <button type="button" class="operator" onclick="addToExpression('-')">-</button>
        
                    <button type="button" onclick="addToExpression('0')">0</button>
                    <button type="button" onclick="addToExpression('.')">.</button>
                    <button type="button" class="equal" onclick="calculate()">=</button>
                    <button type="button" class="operator" onclick="addToExpression('+')">+</button>
        
                    <button type="button" style="grid-column: span 4; background:#e74c3c;" onclick="clearExpression()">C</button>
                </form>
            </div>
        </div>
    </div>
</center>
   </div>
    
</body>
</html>
